<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F4F0; --surface:#FFFFFF; --surface-2:#E9EDE7; --ink:#1B2320; --muted:#66706B; --line:#D9DED8;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#DDEBE2; --accent-text:#1F5A3F;
  --warn:#B8741A; --warn-soft:#F6E9D2; --danger:#B23A3A; --danger-soft:#F5DEDE; --ok:#2F6B4F;
  --radius:12px; --tabh:64px;
  --display:'Fraunces',Georgia,serif; --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#141816; --surface:#1D2320; --surface-2:#26302B; --ink:#EAEFEA; --muted:#98A39D; --line:#2E3834;
  --accent:#7FC29B; --accent-ink:#0F1F17; --accent-soft:#213229; --accent-text:#A9DCBF;
  --warn:#E0A44A; --warn-soft:#3A2D18; --danger:#E27676; --danger-soft:#3A2020; --ok:#7FC29B;
}}
:root[data-theme="dark"]{
  --ground:#141816; --surface:#1D2320; --surface-2:#26302B; --ink:#EAEFEA; --muted:#98A39D; --line:#2E3834;
  --accent:#7FC29B; --accent-ink:#0F1F17; --accent-soft:#213229; --accent-text:#A9DCBF;
  --warn:#E0A44A; --warn-soft:#3A2D18; --danger:#E27676; --danger-soft:#3A2020; --ok:#7FC29B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 0 8px}
.top h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;letter-spacing:-.01em}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
h2{font-family:var(--display);font-weight:500;font-size:21px;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card + .card{margin-top:10px}
.day{padding:10px 14px 4px;display:flex;justify-content:space-between;align-items:baseline}
.day b{font-weight:600}
.day span{color:var(--muted);font-size:13px}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;cursor:pointer;line-height:1.4;min-height:44px}
.slot:focus-visible,.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slot .meal{width:74px;color:var(--muted);font-size:13px;flex:none}
.slot .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .name.empty{color:var(--muted)}
.slot .pers{font-size:12px;color:var(--accent-text);background:var(--accent-soft);border-radius:999px;padding:2px 8px;flex:none;font-variant-numeric:tabular-nums}
.slot .fz{font-size:12px;color:var(--muted);flex:none}
.slot.cooked .name{color:var(--muted)}
.slot.cooked .fz{color:var(--accent-text)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn.block{width:100%;margin-top:14px}
.icon{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.tile .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{font-size:12px;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .chk{width:22px;height:22px;flex:none;border:1.5px solid var(--muted);border-radius:6px;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--accent-ink);padding:0}
.item.done .chk{background:var(--accent);border-color:var(--accent)}
.item .txt{flex:1;min-width:0}
.item .txt .q{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item.have{opacity:.75}
.item .price{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom,0px));padding:0 0 env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:5}
.tab{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;cursor:pointer;padding:0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-text);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet-card{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-card h2{margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:10px 12px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .btn{flex:1}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.rec{width:100%;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.rec .t{font-weight:500}
.rec .m{color:var(--muted);font-size:13px}
.rec .cost{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--accent-text);font-size:14px;flex:none}
.ing{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.ing:first-child{border-top:0}
.ing span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
ol.steps{padding-left:20px;margin:6px 0 0}
ol.steps li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 10px;text-align:left;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.best{color:var(--accent-text);font-weight:600}
.prod{padding:12px 14px}
.prod .pr{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:14px;font-variant-numeric:tabular-nums}
.prod .pr span b{font-weight:500}
.prod .pr .unit{color:var(--muted);font-size:12px}
.hist{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;font-size:13px;color:var(--muted);display:none}
.prod.open .hist{display:block}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums}
.up{color:var(--warn)} .down{color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1}
.trow{padding:10px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--ground);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip.small{padding:4px 10px;font-size:13px}
.chip.ghost{border-color:transparent;color:var(--accent-text)}
.chip .cnt{font-size:12px;opacity:.75;margin-left:2px}
.rec .cost.approx{color:var(--muted)}
.rec .tag{margin-left:0;margin-right:4px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

function catalogRecipe(c){
  const m=META[c[0]]||['','',''];const tags=c[4].filter(t=>t!=='persan');if(m[2])tags.push(m[2]);
  return {id:'c'+c[0].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,''),catalog:true,name:c[0],persons:c[1],minutes:c[2],cat:c[3],tags,cost:c[5],cuisine:m[0],protein:m[1],
    ingredients:c[6].map(parseIng).filter(Boolean),steps:c[7].slice()};
}
const PORK_WORDS=['porc','lardon','jambon','saucisse','chair à saucisse','bacon','chorizo'];
function porkText(r){return r.ingredients.map(i=>norm(i.name)).join(' | ').replace(/jambon de (dinde|poulet|volaille)/g,'volaille')}
function guessProtein(r){
  const n=porkText(r);
  if(PORK_WORDS.some(w=>n.includes(w)))return 'Porc';
  if(/agneau|mouton|merguez/.test(n))return 'Agneau';
  if(/veau/.test(n))return 'Veau';
  if(/bœuf|boeuf|steak|viande hach/.test(n))return 'Bœuf';
  if(/poulet|dinde|volaille|canard/.test(n))return 'Volaille';
  if(/poisson|saumon|thon|cabillaud|crevette|colin|merlu|sardine|maquereau|dorade/.test(n))return 'Poisson';
  if(/œuf|oeuf/.test(n))return 'Œufs';
  return 'Végétarien';
}
function hasPork(r){const n=porkText(r);return r.protein==='Porc'||PORK_WORDS.some(w=>n.includes(w))}
function seed(){
  return {settings:{persons:4,catalogVersion:CATALOG_VERSION},recipes:CATALOG.map(catalogRecipe),weeks:{},lists:{},prices:[]};
}
function importCatalog(s){
  /* les 3 exemples de la toute première version sont remplacés par leur équivalent du catalogue */
  const remap={};
  s.recipes=s.recipes.filter(r=>{
    if(!r.sample)return true;
    const base=norm(r.name).replace(/\s*\(.*\)\s*$/,'');
    const c=CATALOG.find(x=>norm(x[0])===base);
    if(c)remap[r.id]=catalogRecipe(c).id;
    return false;
  });
  Object.values(s.weeks||{}).forEach(w=>Object.values(w.slots||{}).forEach(sl=>{if(sl&&remap[sl.recipeId])sl.recipeId=remap[sl.recipeId]}));
  /* les plats du catalogue non modifiés par l'utilisateur sont resynchronisés avec la version courante (noms, ingrédients, sans porc) */
  const idMap={};
  s.recipes.forEach(r=>{
    if(!r.catalog)return;
    const newName=RENAMED[r.name]||r.name;const c=CATALOG.find(x=>x[0]===newName);
    if(c){const fresh=catalogRecipe(c);idMap[r.id]=fresh.id;Object.assign(r,fresh)}else r._drop=true;
  });
  s.recipes=s.recipes.filter(r=>!r._drop);
  Object.values(s.weeks||{}).forEach(w=>Object.keys(w.slots||{}).forEach(k=>{const sl=w.slots[k];if(!sl||!sl.recipeId)return;if(idMap[sl.recipeId])sl.recipeId=idMap[sl.recipeId];else if(!s.recipes.find(r=>r.id===sl.recipeId))delete w.slots[k]}));
  const have=new Set(s.recipes.map(r=>matchKey(r.name)));
  CATALOG.forEach(c=>{if(!have.has(matchKey(c[0])))s.recipes.push(catalogRecipe(c))});
  /* version 2 : pays, protéine et saison sur les plats du catalogue déjà présents, sans toucher aux modifications de l'utilisateur */
  s.recipes.forEach(r=>{
    if(!r.tags)r.tags=[];
    const m=META[r.name];
    if(m){if(!r.cuisine)r.cuisine=m[0];if(!r.protein)r.protein=m[1];if(m[2]&&!r.tags.includes('été')&&!r.tags.includes('hiver'))r.tags.push(m[2])}
    r.tags=r.tags.filter(t=>t!=='persan');
    if(!r.protein)r.protein=guessProtein(r);
  });
  s.settings.catalogVersion=CATALOG_VERSION;
}

function autoTags(r){
  const t=new Set(r.tags||[]);
  if(r.minutes&&r.minutes<=25)t.add('rapide');
  const pp=perPerson(r);if(pp!=null&&pp<=2)t.add('pas cher');
  if((r.protein||guessProtein(r))==='Végétarien')t.add('végétarien');
  if(!hasPork(r))t.add('sans porc');

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().trim().replace(/\s+/g,' ')}
function matchKey(s){let n=norm(s).replace(/^(des|les|du|de la|de l'|de|d'|le|la|l')\s+/,'');if(n.length>3&&n.endsWith('s')&&!n.endsWith('ss'))n=n.slice(0,-1);return n}
function fam(u){if(u==='g'||u==='kg')return 'g';if(u==='ml'||u==='cl'||u==='l')return 'ml';return u||'pièce'}
function toBase(q,u){if(u==='kg')return q*1000;if(u==='l')return q*1000;if(u==='cl')return q*10;return q}
function fmtQty(q,f){
  if(f==='g'){return q>=1000?trim(q/1000)+' kg':trim(q)+' g'}
  if(f==='ml'){return q>=1000?trim(q/1000)+' l':trim(q)+' ml'}
  if(f==='pièce')return trim(q);
  return trim(q)+' '+f;
}
function trim(n){return (Math.round(n*100)/100).toLocaleString('fr-FR')}
function eur(n){return n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}
function catOf(name){const n=norm(name);for(const [cat,words] of CAT_WORDS){if(words.some(w=>n.includes(w)))return cat}return 'Autre'}
function parseIng(line){
  line=line.trim().replace(/^[-•*]\s*/,'');if(!line)return null;
  const m=line.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/);
  let qty=1,rest=line;
  if(m){qty=parseFloat(m[1].replace(',','.'));rest=m[2].trim()}
  let unit='';
  const w=rest.split(' ');
  const first=w[0]?w[0].toLowerCase().replace(/\.$/,''):'';
  if(UNIT_OF[first]&&w.length>1){unit=UNIT_OF[first];rest=w.slice(1).join(' ')}
  rest=rest.replace(/^(de|d')\s+/i,'').trim();
  return {qty,unit,name:rest};
}
function ingLine(i){return (i.qty!==1||i.unit?trim(i.qty)+' ':'')+(i.unit?i.unit+' ':'')+i.name}
function fmtIng(i){return i.unit?trim(i.qty)+' '+i.unit:(i.qty!==1?trim(i.qty):'')}
function recipeById(id){return S.recipes.find(r=>r.id===id)}

/* dates */
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
const fmtDay=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'});
const fmtLong=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'});
function weekLabel(mon){return fmtDay.format(mon)+' – '+fmtDay.format(addDays(mon,6))}
let weekMon=mondayOf(new Date());
function weekKey(){return iso(weekMon)}
function week(){return S.weeks[weekKey()]||(S.weeks[weekKey()]={slots:{}})}

/* prices */
function latestPrice(product,store,f){
  const k=matchKey(product);
  const es=S.prices.filter(p=>matchKey(p.product)===k&&(!store||p.store===store)&&(!f||fam(p.unit)===f)).sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:0);
  return es[0]||null;
}
function unitPrice(e){const b=toBase(e.qty,e.unit);return b>0?e.price/b:null}
function itemCost(item,store){
  const f=fam(item.unit);const e=latestPrice(item.name,store,f);if(!e)return null;
  const up=unitPrice(e);if(up==null)return null;
  const base=toBase(item.qty,item.unit);
  const pieceLike=f!=='g'&&f!=='ml';
  if(pieceLike&&e.unit!==item.unit&&!(f==='pièce'&&fam(e.unit)==='pièce'))return null;
  return up*base;
}
function estimate(items){
  const out=[];
  for(const st of STORES){let total=0,n=0;for(const it of items){const c=itemCost(it,st);if(c!=null){total+=c;n++}}out.push({store:st,total,n})}
  return out;
}
/* Prix moyen d'un produit : moyenne du dernier prix relevé dans chaque enseigne (au prix unitaire, donc 1 kg à 2,40 € et 500 g à 1,30 € se comparent) */
function avgPrice(product,f){
  const k=matchKey(product);const latest={};
  S.prices.forEach(p=>{if(matchKey(p.product)!==k||(f&&fam(p.unit)!==f))return;const cur=latest[p.store];if(!cur||p.date>cur.date)latest[p.store]=p});
  const es=Object.values(latest);const ups=es.map(unitPrice).filter(v=>v!=null);
  if(!ups.length)return null;
  return {up:ups.reduce((a,b)=>a+b,0)/ups.length,n:ups.length,unit:es[0].unit,stores:es.map(e=>e.store)};
}
/* Coût d'un ingrédient au prorata de la quantité utilisée (300 g de riz ne coûtent pas le sac entier) */
function itemCostAvg(item){
  const f=fam(item.unit);const a=avgPrice(item.name,f);if(!a)return null;
  const pieceLike=f!=='g'&&f!=='ml';
  if(pieceLike&&a.unit!==item.unit&&!(f==='pièce'&&fam(a.unit)==='pièce'))return null;
  return {cost:a.up*toBase(item.qty,item.unit),n:a.n};
}
/* Coût d'une recette : tes prix pour les ingrédients connus, l'estimation indicative pour le reste, au prorata.
   exact = tous les ingrédients ont un prix à toi ; n/of = combien en ont un. */
function recipeCost(r,persons){
  const p=persons||r.persons;const of=r.ingredients.length;if(!of)return null;
  let known=0,n=0;const detail=[];
  r.ingredients.forEach(i=>{const c=itemCostAvg({name:i.name,unit:i.unit,qty:i.qty*p/r.persons});if(c){known+=c.cost;n++;detail.push(c.cost)}else detail.push(null)});
  const indic=typeof r.cost==='number'?r.cost*p/r.persons:null;
  let total=null,exact=false;
  if(n===of){total=known;exact=true}
  else if(indic!=null){total=known+indic*(of-n)/of}
  else if(n>0){total=known}
  if(total==null)return null;
  return {total,n,of,exact,detail,known,indic};
}

function slotCost(s){
  const r=s&&s.recipeId?recipeById(s.recipeId):null;if(!r)return null;

function suggestWeek(){
  const w=week();const meals=document.getElementById('s-meals').value;
  const persons=Math.max(1,parseInt(document.getElementById('s-persons').value,10)||S.settings.persons);
  const budget=parseFloat(String(document.getElementById('s-budget').value).replace(',','.'))||0;
  const keep=document.getElementById('s-keep').checked;const preferFreeze=document.getElementById('s-freeze').checked;const wantVeg=document.getElementById('s-veg').checked;const wantSeason=document.getElementById('s-season').checked;
  const keys=[];DAYS.forEach((d,i)=>{if(meals!=='dinner')keys.push(i+'-lunch');if(meals!=='lunch')keys.push(i+'-dinner')});
  let targets=keys.filter(k=>!keep||!w.slots[k]||!(w.slots[k].recipeId||w.slots[k].label));
  if(!targets.length){toast('Tous ces repas sont déjà prévus');return}
  /* les plats déjà cuisinés au congélateur passent en premier : ils sont déjà payés */
  let fromFreezer=0;
  if(document.getElementById('s-frozen').checked){
    const planned=new Set(Object.values(w.slots).filter(s=>s&&s.stockId).map(s=>s.stockId));
    frozenDishes().filter(d=>!planned.has(d.id)).forEach(d=>{
      if(!targets.length)return;const k=targets.shift();
      w.slots[k]={recipeId:'',label:d.name+' (congélateur)',persons:Math.min(persons,Math.round(d.qty)||persons),freeze:false,stockId:d.id};fromFreezer++;
    });
    if(!targets.length){S.settings.persons=persons;save();closeSheet();render();toast(fromFreezer+' repas pris dans le congélateur');return}
  }
  const used=new Set(Object.values(w.slots).filter(s=>s&&s.recipeId).map(s=>s.recipeId));
  const useF=document.getElementById('s-usefilters').checked&&activeCount()>0;
  const base=useF?S.recipes.filter(r=>matchesFilters(r,F)):S.recipes;
  let pool=base.filter(r=>!used.has(r.id)&&r.ingredients.length);
  if(pool.length<targets.length)pool=base.filter(r=>r.ingredients.length);
  if(!pool.length){toast('Aucun plat ne correspond au filtre');return}
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  pool=shuffle(pool.slice());
  const pp=r=>{const v=perPerson(r);return v==null?3.5:v};
  let remaining=budget>0?budget:0;let lastCat=null;const chosen=[];let vegDone=!wantVeg;
  targets.forEach((k,idx)=>{
    const left=targets.length-idx;
    const mult=r=>(preferFreeze&&autoTags(r).includes('congélateur'))?2:1;
    let cands=pool.filter(r=>!chosen.includes(r));
    if(!cands.length)cands=pool.slice();
    if(wantSeason){const s=cands.filter(r=>!offSeason(r));if(s.length)cands=s}
    let ranked=cands.filter(r=>r.cat!==lastCat);if(!ranked.length)ranked=cands;
    if(wantSeason){const s=ranked.filter(r=>(r.tags||[]).includes(currentSeason()));if(s.length&&Math.random()<0.5)ranked=s}
    if(!vegDone){const v=ranked.filter(r=>autoTags(r).includes('végétarien'));if(v.length&&(left<=2||Math.random()<0.4))ranked=v}
    if(preferFreeze){const f=ranked.filter(r=>autoTags(r).includes('congélateur'));if(f.length&&Math.random()<0.6)ranked=f}
    if(budget>0){
      const cap=remaining/left*1.25;
      const ok=ranked.filter(r=>pp(r)*persons*mult(r)<=cap);
      if(ok.length)ranked=ok;else ranked=ranked.slice().sort((a,b)=>pp(a)-pp(b)).slice(0,3);
    }
    const r=ranked[Math.floor(Math.random()*ranked.length)];if(!r)return;
    const m=mult(r);const cost=pp(r)*persons*m;
    w.slots[k]={recipeId:r.id,label:'',persons:persons*m,freeze:m>1};
    chosen.push(r);lastCat=r.cat||null;if(autoTags(r).includes('végétarien'))vegDone=true;
    if(budget>0)remaining=Math.max(0,remaining-cost);
  });
  S.settings.persons=persons;save();closeSheet();render();
  const wc=weekCost(w);
  toast(targets.length+' repas proposés'+(fromFreezer?' + '+fromFreezer+' du congélateur':'')+(wc.total>0?' · ≈ '+eur(wc.total)+(budget>0?' pour '+eur(budget)+' demandés':''):''));
}

/* Sélecteur de recette : même recherche et mêmes filtres que le carnet */
function openPicker(key){
  readSlotDraft();
  const n=activeCount();
  sheet(`<h2>Choisir une recette</h2>
    <input type="text" id="pick-q" value="${esc(recipeQuery)}" placeholder="Chercher un plat ou un ingrédient" autocomplete="off">
    <div class="chips" style="margin-top:10px"><button class="chip${n?' on':''}" data-act="pick-filters" data-slot="${key}">☰ Filtres${n?' · '+n:''}</button>${QUICK.map(([k,v,l])=>`<button class="chip${F[k].includes(v)?' on':''}" data-act="pick-quick" data-slot="${key}" data-k="${k}" data-v="${esc(v)}">${l}</button>`).join('')}${n?`<button class="chip small ghost" data-act="pick-clear" data-slot="${key}">Tout effacer</button>`:''}</div>
    <div id="pick-list" style="margin-top:12px">${pickList(key)}</div>
    <div class="actions"><button class="btn" data-act="pick-back" data-slot="${key}">Retour</button></div>`);
}
function pickList(key){
  const list=filterRecipes();
  if(!list.length)return `<div class="card"><div class="empty"><b>Aucune recette ne correspond</b>Retire un filtre ou change la recherche.</div></div>`;
  return `<p class="sub" style="margin:0 0 6px">${list.length} plat${list.length>1?'s':''}</p><div class="card">`+list.map((r,idx)=>{const c=costLabel(r);
    return `<button class="rec" data-act="pick-recipe" data-slot="${key}" data-id="${r.id}" style="${idx?'border-top:1px solid var(--line)':''}"><div class="grow"><div class="t">${esc(r.name)}</div><div class="m">${r.persons} pers. · ${r.minutes?r.minutes+' min · ':''}${esc(r.cat||'')}</div><div style="margin-top:3px">${tagPills(r)}</div></div>${c?`<div class="cost${c.exact?'':' approx'}">${c.text}</div>`:''}</button>`}).join('')+'</div>';
}
function reopenSlotFromDraft(recipeId){
  const d=slotDraft;if(!d)return;
  openSlot(d.key,{recipeId:recipeId!==undefined?recipeId:d.recipeId,persons:d.persons,freeze:d.freeze,label:recipeId?'':d.label});
}
/* Depuis le carnet : mettre une recette au menu */
function openPlan(id){
  const r=recipeById(id);if(!r)return;const w=week();
  const opts=[];DAYS.forEach((dn,i)=>MEALS.forEach(([mk,ml])=>{const k=i+'-'+mk;const s=w.slots[k];const cur=s?(s.recipeId?(recipeById(s.recipeId)||{}).name:s.label):'';opts.push([k,dn+' '+ml.toLowerCase()+(cur?' · '+cur:' · libre'),!cur])}));
  const first=opts.find(o=>o[2])||opts[0];
  sheet(`<h2>Mettre au menu</h2><p class="sub">${esc(r.name)} · semaine du ${esc(weekLabel(weekMon))}</p>
    <label for="pl-slot">Quel repas</label><select id="pl-slot">${opts.map(o=>`<option value="${o[0]}"${o[0]===first[0]?' selected':''}>${esc(o[1])}</option>`).join('')}</select>
    <label for="pl-persons">Nombre de personnes</label><input type="number" id="pl-persons" min="1" max="30" value="${S.settings.persons}">
    <label class="row" style="margin-top:14px;cursor:pointer;color:inherit;font-size:inherit"><input type="checkbox" id="pl-freeze" style="width:auto"> <span>Une partie au congélateur</span></label>
    <div class="actions"><button class="btn" data-act="recipe-open" data-id="${r.id}">Retour</button><button class="btn primary" data-act="plan-save" data-id="${r.id}">Ajouter au menu</button></div>`);
}
function savePlan(id){
  const w=week();const key=document.getElementById('pl-slot').value;
  const persons=Math.max(1,parseInt(document.getElementById('pl-persons').value,10)||S.settings.persons);
  w.slots[key]={recipeId:id,label:'',persons,freeze:document.getElementById('pl-freeze').checked};
  S.settings.persons=persons;save();closeSheet();tab='week';render();
  const [di,mk]=key.split('-');toast((recipeById(id)||{}).name+' → '+DAYS[di]+' '+MEALS.find(m=>m[0]===mk)[1].toLowerCase());
}
function saveSlot(key){
  const w=week();const v=document.getElementById('f-free').checked?'__free':document.getElementById('f-recipe').value;
  const persons=Math.max(1,parseInt(document.getElementById('f-persons').value,10)||S.settings.persons);
  const freeze=document.getElementById('f-freeze').checked;
  const old=w.slots[key]||{};
  if(!v){delete w.slots[key]}
  else if(v==='__free'){const label=document.getElementById('f-label').value.trim()||'Autre';w.slots[key]={recipeId:'',label,persons,freeze,stockId:old.stockId,cooked:old.cooked}}
  else w.slots[key]={recipeId:v,label:'',persons,freeze,cooked:old.recipeId===v?old.cooked:false};
  S.settings.persons=persons;save();closeSheet();render();
}

/* ---------- stock ---------- */
const LOCS=[['frigo','Frigo'],['congélateur','Congélateur'],['placard','Placard']];
function guessLoc(cat){if(cat==='Surgelés')return 'congélateur';if(['Fruits et légumes','Viande et poisson','Crèmerie et œufs','Pain'].includes(cat))return 'frigo';return 'placard'}
function stockFind(name,f){const k=matchKey(name);return S.stock.find(x=>x.kind!=='plat'&&matchKey(x.name)===k&&x.fam===f)}
function stockAdd(name,qtyBase,f,cat,loc){
  if(!(qtyBase>0))return;
  let x=stockFind(name,f);
  if(x){x.qty=Math.round((x.qty+qtyBase)*100)/100;x.updated=today()}
  else{cat=cat||catOf(name);S.stock.push({id:uid(),kind:'ingredient',name,qty:Math.round(qtyBase*100)/100,fam:f,cat,loc:loc||guessLoc(cat),exp:null,updated:today()})}
}
function stockTake(name,qtyBase,f){
  const x=stockFind(name,f);if(!x)return 0;
  const t=Math.min(x.qty,qtyBase);x.qty=Math.round((x.qty-t)*100)/100;
  if(x.qty<=0.001)S.stock=S.stock.filter(y=>y!==x);else x.updated=today();
  return t;
}
function frozenDishes(){return S.stock.filter(x=>x.kind==='plat'&&x.qty>0)}
function openCook(key){
  const w=week();const s=w.slots[key];if(!s)return;
  if(s.stockId){
    const d=S.stock.find(x=>x.id===s.stockId);
    sheet(`<h2>Cuisiné</h2><p class="sub">${d?esc(d.name)+' : '+trim(d.qty)+' portion'+(d.qty>1?'s':'')+' au congélateur.':'Ce plat n’est plus dans le stock.'}</p>
      <label for="k-portions">Portions sorties du congélateur</label><input type="number" id="k-portions" min="0" step="1" value="${Math.min(s.persons||1,d?d.qty:0)}">
      <div class="actions"><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="cook-confirm" data-slot="${key}">Confirmer</button></div>`);
    return;
  }
  const r=recipeById(s.recipeId);if(!r)return;
  const factor=(s.persons||r.persons)/r.persons;
  const rows=r.ingredients.map(i=>{const f=fam(i.unit);const need=toBase(i.qty,i.unit)*factor;const st=stockFind(i.name,f);
    return `<div class="ing"><span>${esc(i.name)}</span><span>${esc(fmtQty(need,f))}${st?' <span style="color:var(--accent-text)">· en stock '+esc(fmtQty(st.qty,f))+'</span>':' <span style="color:var(--muted)">· pas en stock</span>'}</span></div>`}).join('');
  const defPortions=s.freeze?Math.max(0,Math.round((s.persons||r.persons)-S.settings.persons)):0;
  sheet(`<h2>Cuisiné : ${esc(r.name)}</h2><p class="sub">Les quantités ci-dessous sortent du stock (seulement ce qui y est).</p><div>${rows}</div>
    <label for="k-portions">Portions mises au congélateur</label><input type="number" id="k-portions" min="0" step="1" value="${defPortions}">
    <p class="note">Les portions congelées deviennent un plat prêt dans le stock, que « Proposer une semaine » utilisera en priorité.</p>
    <div class="actions"><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="cook-confirm" data-slot="${key}">Confirmer</button></div>`);
}
function confirmCook(key){
  const w=week();const s=w.slots[key];if(!s)return;
  const portions=Math.max(0,parseInt(document.getElementById('k-portions').value,10)||0);
  if(s.stockId){
    const d=S.stock.find(x=>x.id===s.stockId);
    if(d){d.qty=Math.round((d.qty-portions)*100)/100;if(d.qty<=0)S.stock=S.stock.filter(x=>x!==d);else d.updated=today()}
    s.cooked=true;save();closeSheet();render();toast('Congélateur mis à jour');return;
  }
  const r=recipeById(s.recipeId);if(!r)return;
  const factor=(s.persons||r.persons)/r.persons;let taken=0;
  r.ingredients.forEach(i=>{const f=fam(i.unit);if(stockTake(i.name,toBase(i.qty,i.unit)*factor,f)>0)taken++});
  if(portions>0){
    const ex=S.stock.find(x=>x.kind==='plat'&&x.recipeId===r.id);
    if(ex){ex.qty+=portions;ex.updated=today()}else S.stock.push({id:uid(),kind:'plat',name:r.name,recipeId:r.id,qty:portions,fam:'portion',cat:'Plats préparés',loc:'congélateur',exp:null,updated:today()});
  }
  s.cooked=true;save();closeSheet();render();
  toast(taken+' ingrédient'+(taken>1?'s':'')+' retiré'+(taken>1?'s':'')+' du stock'+(portions?' · '+portions+' portion'+(portions>1?'s':'')+' au congélateur':''));
}
function renderStock(){
  const soon=addDays(new Date(),3);const soonIso=iso(soon);const t=today();
  const expiring=S.stock.filter(x=>x.exp&&x.exp<=soonIso);
  let h=`<div class="row between" style="margin-top:6px"><div><h2>Stock de la maison</h2><p class="sub">${S.stock.length} article${S.stock.length>1?'s':''}</p></div><button class="btn primary" data-act="stock-new">+ Ajouter</button></div>`;
  h+=`<p class="note">Le stock se remplit quand tu coches un article au magasin ou enregistres un ticket, et se vide quand tu marques un repas « Cuisiné ». Corrige ici ce qui a bougé sans l’app.</p>`;
  if(expiring.length)h+=`<div class="card" style="margin-top:12px;border-color:var(--warn)"><div style="padding:10px 14px"><b style="color:var(--warn)">À consommer vite</b><p class="sub" style="margin:0">${expiring.map(x=>esc(x.name)+(x.exp<t?' (dépassé)':'')).join(', ')}</p></div></div>`;
  if(!S.stock.length)return h+`<div class="card" style="margin-top:14px"><div class="empty"><b>Le stock est vide</b>Coche tes prochaines courses au magasin, ou ajoute à la main ce que tu as déjà.</div></div>`;
  const dishes=frozenDishes();
  if(dishes.length){h+=`<h3>Plats prêts au congélateur</h3><div class="card">`+dishes.map(x=>`<div class="item"><div class="txt"><div>❄ ${esc(x.name)}</div><div class="q">${trim(x.qty)} portion${x.qty>1?'s':''} · ${esc(fmtDay.format(new Date(x.updated+'T12:00:00')))}</div></div><button class="btn small" data-act="stock-edit" data-id="${x.id}">Modifier</button></div>`).join('')+'</div>'}
  LOCS.forEach(([loc,label])=>{
    const its=S.stock.filter(x=>x.kind!=='plat'&&x.loc===loc).sort((a,b)=>a.name.localeCompare(b.name,'fr'));if(!its.length)return;
    h+=`<h3>${label}</h3><div class="card">`+its.map(x=>`<div class="item"><div class="txt"><div>${esc(x.name)}</div><div class="q">${esc(fmtQty(x.qty,x.fam))}${x.exp?' · <span style="color:'+(x.exp<=soonIso?'var(--warn)':'inherit')+'">jusqu’au '+esc(fmtDay.format(new Date(x.exp+'T12:00:00')))+'</span>':''}</div></div><button class="btn small" data-act="stock-edit" data-id="${x.id}">Modifier</button></div>`).join('')+'</div>';
  });
  return h;
}
function editStock(id){
  const x=id?S.stock.find(s=>s.id===id):null;
  const isDish=x&&x.kind==='plat';
  sheet(`<h2>${x?'Modifier':'Ajouter au stock'}</h2>
    ${isDish?`<p class="sub">${esc(x.name)}, plat prêt</p>`:`<label for="st-name">Article</label><input type="text" id="st-name" value="${x?esc(x.name):''}" placeholder="riz basmati" list="p-names"><datalist id="p-names">${productNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`}
    <div class="grid2"><div><label for="st-qty">${isDish?'Portions':'Quantité'}</label><input type="number" id="st-qty" min="0" step="any" inputmode="decimal" value="${x?(isDish?x.qty:(x.fam==='g'&&x.qty>=1000?x.qty/1000:x.fam==='ml'&&x.qty>=1000?x.qty/1000:x.qty)):1}"></div>
    <div>${isDish?'':`<label for="st-unit">Unité</label><select id="st-unit">${PRICE_UNITS.map(u=>{const sel=x?((x.fam==='g'&&x.qty>=1000)?'kg':(x.fam==='ml'&&x.qty>=1000)?'l':x.fam==='g'?'g':x.fam==='ml'?'ml':x.fam):'pièce';return `<option${u===sel?' selected':''}>${u}</option>`}).join('')}</select>`}</div></div>
    <div class="grid2"><div><label for="st-loc">Où</label><select id="st-loc">${LOCS.map(([v,l])=>`<option value="${v}"${x&&x.loc===v?' selected':''}>${l}</option>`).join('')}</select></div><div><label for="st-exp">À consommer avant (facultatif)</label><input type="date" id="st-exp" value="${x&&x.exp?x.exp:''}"></div></div>
    <div class="actions"><button class="btn" data-act="close">Annuler</button>${x?`<button class="btn danger" data-act="stock-delete" data-id="${x.id}">Retirer</button>`:''}<button class="btn primary" data-act="stock-save" data-id="${x?x.id:''}">Enregistrer</button></div>`);
}
function saveStock(id){
  const x=id?S.stock.find(s=>s.id===id):null;
  const qty=parseFloat(String(document.getElementById('st-qty').value).replace(',','.'));
  const loc=document.getElementById('st-loc').value;const exp=document.getElementById('st-exp').value||null;
  if(x&&x.kind==='plat'){if(!(qty>0)){S.stock=S.stock.filter(s=>s!==x)}else{x.qty=qty;x.loc=loc;x.exp=exp;x.updated=today()}save();closeSheet();render();return}
  const name=document.getElementById('st-name').value.trim();const unit=document.getElementById('st-unit').value;
  if(!name){toast('Indique l’article');return}
  if(!(qty>0)){if(x)S.stock=S.stock.filter(s=>s!==x);save();closeSheet();render();return}
  const f=fam(unit);const base=toBase(qty,unit);
  if(x){Object.assign(x,{name,qty:base,fam:f,loc,exp,updated:today()})}
  else{const ex=stockFind(name,f);if(ex){ex.qty=base;ex.loc=loc;ex.exp=exp;ex.updated=today()}else S.stock.push({id:uid(),kind:'ingredient',name,qty:base,fam:f,cat:catOf(name),loc,exp,updated:today()})}
  save();closeSheet();render();
}

/* ---------- recipes ---------- */
let recipeQuery='';
/* Filtres combinables : à l'intérieur d'un groupe c'est OU, entre les groupes c'est ET */
const FILTER_GROUPS=[
  {key:'cuisine',label:'Pays',options:CUISINES.map(c=>[c,c])},
  {key:'protein',label:'Protéine',options:PROTEINS.map(p=>[p,p])},
  {key:'cat',label:'Type de plat',options:CATS_R.map(c=>[c,c])},
  {key:'time',label:'Temps',options:[['court','20 min ou moins'],['moyen','21 à 45 min'],['long','plus de 45 min']]},
  {key:'season',label:'Saison',options:[['__now','De saison en ce moment'],['été','Plutôt été'],['hiver','Plutôt hiver']]},
  {key:'tags',label:'Pratique',options:[['rapide','Rapide'],['congélateur','À congeler'],['pas cher','Pas cher'],['enfants','Enfants'],['four','Au four'],['sans porc','Sans porc']]},
  {key:'origin',label:'Origine',options:[['mien','Mes recettes'],['catalogue','Catalogue']]},
];
const QUICK=[['season','__now','De saison'],['tags','rapide','Rapide'],['tags','congélateur','À congeler'],['protein','Végétarien','Végétarien'],['tags','pas cher','Pas cher']];
let F=emptyFilters();
function emptyFilters(){const f={};FILTER_GROUPS.forEach(g=>f[g.key]=[]);return f}
function activeCount(){return Object.values(F).reduce((n,a)=>n+a.length,0)}
function recipeValues(r,key){
  switch(key){
    case 'cuisine':return [r.cuisine||'Autre'];
    case 'protein':return [r.protein||guessProtein(r)];
    case 'cat':return [r.cat||''];
    case 'time':return [timeBand(r)];
    case 'season':{const t=(r.tags||[]).filter(t=>t==='été'||t==='hiver');if(inSeason(r))t.push('__now');return t}
    case 'tags':return autoTags(r);
    case 'origin':return [r.catalog?'catalogue':'mien'];
  }
  return [];
}
function matchesFilters(r,f){
  return FILTER_GROUPS.every(g=>{const sel=f[g.key];if(!sel.length)return true;const vals=recipeValues(r,g.key);return sel.some(v=>vals.includes(v))});
}
function filterRecipes(f){
  f=f||F;const q=norm(recipeQuery);
  return S.recipes.filter(r=>{
    if(q&&!norm(r.name).includes(q)&&!r.ingredients.some(i=>norm(i.name).includes(q)))return false;
    return matchesFilters(r,f);
  }).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
}
function toggleFilter(key,val){const a=F[key];const i=a.indexOf(val);if(i>=0)a.splice(i,1);else a.push(val)}
function labelOf(key,val){if(val==='__now')return 'De saison ('+seasonLabel()+')';const g=FILTER_GROUPS.find(g=>g.key===key);const o=g&&g.options.find(o=>o[0]===val);return o?o[1]:val}
function tagPills(r){
  const shown=autoTags(r).filter(t=>t!=='sans porc');
  return `<span class="tag">${esc(r.cuisine||'Autre')}</span><span class="tag">${esc(r.protein||guessProtein(r))}</span>`+shown.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
}
function renderRecipes(){
  const list=filterRecipes();const n=activeCount();
  const active=[];FILTER_GROUPS.forEach(g=>F[g.key].forEach(v=>active.push([g.key,v])));
  let h=`<div class="row between" style="margin-top:6px"><div><h2>Carnet de recettes</h2><p class="sub">${S.recipes.length} recette${S.recipes.length>1?'s':''}</p></div><button class="btn primary" data-act="recipe-new">+ Nouvelle</button></div>
  <input type="text" id="recipe-q" value="${esc(recipeQuery)}" placeholder="Chercher un plat ou un ingrédient" style="margin-top:12px" autocomplete="off">
  <div class="chips" style="margin-top:10px"><button class="chip${n?' on':''}" data-act="filters-open">☰ Filtres${n?' · '+n:''}</button>${QUICK.map(([k,v,l])=>`<button class="chip${F[k].includes(v)?' on':''}" data-act="filter-toggle" data-k="${k}" data-v="${esc(v)}">${l}</button>`).join('')}</div>`;
  if(active.length)h+=`<div class="chips" style="margin-top:8px">${active.map(([k,v])=>`<button class="chip small" data-act="filter-toggle" data-k="${k}" data-v="${esc(v)}" aria-label="Retirer le filtre ${esc(labelOf(k,v))}">${esc(labelOf(k,v))} ×</button>`).join('')}<button class="chip small ghost" data-act="filters-clear">Tout effacer</button></div>`;
  if(!list.length)return h+`<div class="card" style="margin-top:14px"><div class="empty"><b>Aucune recette ne correspond</b>Retire un filtre, ou ajoute la tienne avec « + Nouvelle ».</div></div>`;
  h+=`<p class="sub" style="margin:12px 0 6px">${list.length} plat${list.length>1?'s':''}</p><div class="card">`;
  list.forEach((r,idx)=>{
    const c=costLabel(r);
    h+=`<button class="rec" data-act="recipe-open" data-id="${r.id}" style="${idx?'border-top:1px solid var(--line)':''}"><div class="grow"><div class="t">${esc(r.name)}</div><div class="m">${r.persons} pers. · ${r.minutes?r.minutes+' min · ':''}${esc(r.cat||'')}</div><div style="margin-top:3px">${tagPills(r)}</div></div>${c?`<div class="cost${c.exact?'':' approx'}" title="${esc(c.title)}">${c.text}</div>`:''}</button>`;
  });
  return h+'</div>';
}
function openFilters(after){
  const draft=JSON.parse(JSON.stringify(F));
  const groupHtml=g=>`<h3 style="margin-top:16px">${g.label}</h3><div class="chips">${g.options.map(([v,l])=>{
    const cnt=filterRecipes(Object.assign({},draft,{[g.key]:[v]})).length;
    return `<button class="chip${draft[g.key].includes(v)?' on':''}" data-fk="${g.key}" data-fv="${esc(v)}">${esc(l)} <span class="cnt">${cnt}</span></button>`}).join('')}</div>`;
  const body=()=>`<h2>Filtrer les recettes</h2><p class="sub">Combine ce que tu veux : par exemple Persane + Bœuf, ou Poisson + 20 min.</p>${FILTER_GROUPS.map(groupHtml).join('')}
    <div class="actions"><button class="btn" data-act="filters-reset-draft">Effacer</button><button class="btn primary" data-act="filters-apply">Voir ${filterRecipes(draft).length} plat${filterRecipes(draft).length>1?'s':''}</button></div>`;
  sheet(body());
  sheetClick=e=>{
    const c=e.target.closest('[data-fk]');
    if(c){const a=draft[c.dataset.fk];const i=a.indexOf(c.dataset.fv);if(i>=0)a.splice(i,1);else a.push(c.dataset.fv);sheetBody.innerHTML=body();return}
    const b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='filters-reset-draft'){FILTER_GROUPS.forEach(g=>draft[g.key]=[]);sheetBody.innerHTML=body()}
    else if(b.dataset.act==='filters-apply'){F=draft;if(after)after();else{closeSheet();render()}}
  };
}
function openRecipe(id){
  const r=recipeById(id);if(!r)return;
  const c=costLabel(r);const rc=recipeCost(r);
  sheet(`<h2>${esc(r.name)}</h2><p class="sub">${r.persons} personnes${r.minutes?' · '+r.minutes+' min':''}${r.cat?' · '+esc(r.cat):''}${c?' · '+c.text+(c.exact?'':' (indicatif)'):''}</p><div style="margin-top:6px">${tagPills(r)}</div>
    <h3>Ingrédients</h3><div>${r.ingredients.map((i,idx)=>{const d=rc&&rc.detail?rc.detail[idx]:null;return `<div class="ing"><span>${esc(i.name)}</span><span>${esc(fmtIng(i))}${d!=null?' <b style="font-weight:500;color:var(--accent-text)">'+eur(d)+'</b>':''}</span></div>`}).join('')}</div>

function deleteRecipe(id){

/* ---------- shopping list ---------- */
function generateList(){
  const w=week();const agg={};
  Object.values(w.slots).forEach(s=>{
    const r=s.recipeId?recipeById(s.recipeId):null;if(!r)return;
    const factor=(s.persons||r.persons)/r.persons;
    r.ingredients.forEach(i=>{
      const f=fam(i.unit);const key=matchKey(i.name)+'|'+f;
      const base=toBase(i.qty,i.unit)*factor;
      if(!agg[key])agg[key]={key,name:i.name,fam:f,unit:(f==='g'?'g':f==='ml'?'ml':i.unit),qty:0,cat:catOf(i.name)};
      agg[key].qty+=base;
    });
  });
  const prev=S.lists[weekKey()]||{items:[]};
  const keep={};prev.items.forEach(it=>keep[it.key]=it);
  let inStock=0,partial=0;
  const items=Object.values(agg).map(a=>{
    const old=keep[a.key];let qty=Math.round(a.qty*100)/100;let status=old?old.status:'buy';let note='';
    /* ce qui est déjà dans le stock ne se rachète pas */
    const st=stockFind(a.name,a.fam);
    if(st&&(!old||old.status!=='done')){
      if(st.qty>=a.qty-0.001){status='have';note='en stock : '+fmtQty(st.qty,a.fam);inStock++}
      else{qty=Math.round((a.qty-st.qty)*100)/100;note='il en reste '+fmtQty(st.qty,a.fam)+', il manque '+fmtQty(qty,a.fam);partial++;if(old&&old.status==='have'&&old.auto)status='buy'}
    }else if(old&&old.auto&&old.status==='have'){status='buy'}
    return {key:a.key,name:a.name,unit:a.unit,fam:a.fam,qty,need:Math.round(a.qty*100)/100,cat:a.cat,status,auto:status==='have'&&!!st,note,manual:false};
  });
  prev.items.filter(it=>it.manual).forEach(it=>items.push(it));
  S.lists[weekKey()]={items,generated:today()};
  save();tab='list';render();
  toast(items.length?'Liste générée : '+items.length+' articles'+(inStock?' · '+inStock+' déjà en stock':'')+(partial?' · '+partial+' en partie':''):'Aucune recette au menu cette semaine');
}
function renderList(){
  const L=S.lists[weekKey()];
  let h=`<div class="row between" style="margin-top:6px"><div><h2>Courses</h2><p class="sub">Semaine du ${esc(weekLabel(weekMon))}</p></div><button class="btn small" data-act="generate">Régénérer</button></div>`;
  if(!L||!L.items.length)return h+`<div class="card" style="margin-top:14px"><div class="empty"><b>Pas encore de liste</b>Planifie la semaine puis appuie sur « Générer la liste de courses ».</div></div>`;
  const buy=L.items.filter(i=>i.status==='buy'),done=L.items.filter(i=>i.status==='done'),have=L.items.filter(i=>i.status==='have');
  h+=`<div class="tiles"><div class="tile"><div class="n">${buy.length}</div><div class="l">à acheter</div></div><div class="tile"><div class="n">${done.length}</div><div class="l">dans le panier</div></div><div class="tile"><div class="n">${have.length}</div><div class="l">déjà à la maison</div></div></div>`;
  const toBuy=buy.concat(done);

  if(est.length){
    h+=`<div class="card"><table><tr><th>Enseigne</th><th class="num">Estimation</th><th class="num">Prix connus</th></tr>${est.map((e,i)=>`<tr><td class="${i===0?'best':''}">${esc(e.store)}</td><td class="num ${i===0?'best':''}">${eur(e.total)}</td><td class="num">${e.n} / ${toBuy.length}</td></tr>`).join('')}</table></div><p class="note">Estimation à partir des derniers prix saisis dans l’onglet Prix. Plus tu saisis de prix, plus la comparaison est juste.</p>`;
  }else h+=`<p class="note">Saisis quelques prix dans l’onglet Prix et la liste affichera une estimation par enseigne.</p>`;

  return h;

  S.prices.forEach(p=>{const k=matchKey(p.product);if(!set.has(k))set.set(k,p.product)});
  S.extras.forEach(e=>{const k=matchKey(e.name);if(!set.has(k))set.set(k,e.name)});

const TICKET_PROMPT=`Voici la photo d'un ticket de caisse de supermarché français (une ou plusieurs images du même ticket, dans l'ordre). Extrais les articles achetés.

Règles :
- "enseigne" : l'une de Carrefour, Auchan, Leclerc, Monoprix, Marché, Supérette, ou "Autre" si tu ne sais pas.

- "produit" : nom court et lisible, en minuscules, en français courant (ex. "lait demi-écrémé", "papier toilette", "pommes golden", "lessive liquide"), sans code article ; garde la marque seulement si elle est utile pour reconnaître le produit.
- "prix" : montant payé pour la ligne en euros (nombre avec point décimal), après remise si une remise s'applique à cette ligne.
- "qty" et "unit" : la quantité achetée. Poids affiché (0,452 kg x 3,99 €/kg) : qty 0.452, unit "kg". Plusieurs pièces (2 x 1,20) : qty 2, unit "pièce". Contenance lisible dans le libellé : 6X1L donne qty 6 unit "l" ; 500G donne qty 500 unit "g" ; 75CL donne qty 75 unit "cl" ; 1,5L donne qty 1.5 unit "l". Sinon qty 1, unit "pièce". Unités autorisées : pièce, g, kg, ml, cl, l, botte, boîte, pot, sachet, paquet, bouteille, brique.
- Ignore les lignes de total, sous-total, TVA, remises globales, cagnotte, points fidélité, moyens de paiement, sacs, consignes.
- Si une ligne est illisible, omets-la. Aucun texte en dehors du JSON.`;
function sampleErrorCopy(code){
  switch(code){
    case 'cancelled':return '';
    case 'not_granted':case 'sampling_disabled':return 'L’analyse n’est pas autorisée sur ce compte. Tu peux saisir les prix à la main.';
    case 'rate_limited':return 'Trop de demandes pour l’instant. Réessaie dans quelques minutes.';
    case 'image_rejected':return 'Photo refusée. Essaie une autre photo, nette et bien éclairée.';
    case 'invalid_json':case 'empty_completion':case 'refused':return 'Le ticket n’a pas pu être lu. Réessaie avec une photo plus nette, ou ticket à plat.';
    case 'session_expired':return 'Ta session Claude a expiré, reconnecte-toi puis réessaie.';
    default:return 'L’analyse a échoué. Réessaie dans un instant.';
  }
}
async function analyzeTicket(files){
  if(!SAMPLE||!files||!files.length)return;
  const list=Array.from(files).slice(0,IMG.maxCount||1);
  ticketCtl=new AbortController();
  sheet(`<h2>Lecture du ticket</h2><p class="sub" id="ticket-status">Claude lit le ticket… cela prend en général 10 à 60 secondes.</p><div class="actions"><button class="btn" data-act="ticket-stop">Arrêter</button></div>`);
  try{
    const res=await SAMPLE.json(TICKET_PROMPT,{images:list,signal:ticketCtl.signal,cache:false,
      onText:()=>{const st=document.getElementById('ticket-status');if(st)st.textContent='Les articles arrivent…'}});
    reviewTicket(res);
  }catch(e){
    const msg=sampleErrorCopy(e&&e.code);
    if(!msg){closeSheet();return}
    sheet(`<h2>Lecture du ticket</h2><p class="sub">${esc(msg)}</p><div class="actions"><button class="btn" data-act="close">Fermer</button><button class="btn primary" data-act="ticket-photo">Reprendre une photo</button></div>`);
  }
}
function reviewTicket(res){
  const arts=Array.isArray(res&&res.articles)?res.articles:[];
  if(!arts.length){sheet(`<h2>Lecture du ticket</h2><p class="sub">Aucun article reconnu sur cette photo. Essaie de cadrer le ticket bien à plat, avec les lignes d’articles lisibles.</p><div class="actions"><button class="btn" data-act="close">Fermer</button><button class="btn primary" data-act="ticket-photo">Reprendre une photo</button></div>`);return}
  const names=productNames();const known=new Map(names.map(n=>[matchKey(n),n]));
  const store=STORES.includes(res.enseigne)?res.enseigne:(S.settings.lastStore||STORES[0]);
  const date=/^\d{4}-\d{2}-\d{2}$/.test(String(res.date||''))?res.date:today();
  const total=typeof res.total==='number'&&res.total>0?res.total:null;
  const rows=arts.map((a,i)=>{
    const name=known.get(matchKey(String(a.produit||'')))||String(a.produit||'').trim();
    const qty=Number(a.qty)>0?Number(a.qty):1;const unit=PRICE_UNITS.includes(a.unit)?a.unit:'pièce';const prix=Number(a.prix)>0?Number(a.prix):'';
    return `<div class="trow"><label class="row" style="margin:0;color:inherit;font-size:inherit"><input type="checkbox" class="t-on" style="width:auto" checked><input type="text" class="t-name grow" list="p-names" value="${esc(name)}" placeholder="produit"></label>
      <div class="grid3" style="margin-top:6px"><input type="number" class="t-price" step="0.01" min="0" inputmode="decimal" value="${prix===''?'':prix}" placeholder="prix €"><input type="number" class="t-qty" step="any" min="0" inputmode="decimal" value="${qty}"><select class="t-unit">${PRICE_UNITS.map(u=>`<option${u===unit?' selected':''}>${u}</option>`).join('')}</select></div></div>`;
  }).join('');
  sheet(`<h2>Vérifie le ticket</h2><p class="sub">${arts.length} article${arts.length>1?'s':''} reconnu${arts.length>1?'s':''}. Corrige ce qui est faux, décoche ce qu’il ne faut pas garder.</p>
    <div class="grid2"><div><label for="t-store">Enseigne</label><select id="t-store">${STORES.map(s=>`<option${s===store?' selected':''}>${s}</option>`).join('')}</select></div><div><label for="t-date">Date</label><input type="date" id="t-date" value="${date}"></div></div>
    <label for="t-total">Total du ticket (€)</label><input type="number" id="t-total" step="0.01" min="0" inputmode="decimal" value="${total==null?'':total}" placeholder="laisser vide pour additionner les lignes">
    <datalist id="p-names">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <h3>Articles</h3><div id="t-rows">${rows}</div>
    <label class="row" style="margin-top:14px;cursor:pointer;color:inherit;font-size:inherit"><input type="checkbox" id="t-tick" style="width:auto" checked> <span>Cocher ces articles dans la liste de courses de la semaine</span></label>
    <div class="actions"><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="ticket-save">Enregistrer les prix</button></div>`);
}
function saveTicket(){
  const store=document.getElementById('t-store').value;const date=document.getElementById('t-date').value||today();
  const rowsEl=Array.from(document.querySelectorAll('#t-rows .trow'));
  const entries=[];
  rowsEl.forEach(r=>{
    if(!r.querySelector('.t-on').checked)return;
    const product=r.querySelector('.t-name').value.trim();const price=parseFloat(String(r.querySelector('.t-price').value).replace(',','.'));
    const qty=parseFloat(String(r.querySelector('.t-qty').value).replace(',','.'))||1;const unit=r.querySelector('.t-unit').value;
    if(!product||!(price>0))return;
    entries.push({id:uid(),product,store,price,qty,unit,date});
  });
  if(!entries.length){toast('Aucune ligne complète à enregistrer');return}
  entries.forEach(e=>{S.prices.push(e);stockAdd(e.product,toBase(e.qty,e.unit),fam(e.unit))});
  let total=parseFloat(String(document.getElementById('t-total').value).replace(',','.'));
  if(!(total>0))total=entries.reduce((s,e)=>s+e.price,0);
  S.receipts.push({id:uid(),date,store,total:Math.round(total*100)/100,n:entries.length});
  S.settings.lastStore=store;
  let ticked=0;
  if(document.getElementById('t-tick').checked){
    const L=S.lists[weekKey()];const keys=new Set(entries.map(e=>matchKey(e.product)));
    if(L)L.items.forEach(i=>{if(i.status==='buy'&&keys.has(matchKey(i.name))){i.status='done';ticked++}});
  }
  save();closeSheet();render();
  toast(entries.length+' prix enregistré'+(entries.length>1?'s':'')+(ticked?' · '+ticked+' article'+(ticked>1?'s':'')+' coché'+(ticked>1?'s':''):''));
}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='ticket-file'){const f=e.target.files;if(f&&f.length)analyzeTicket(f);e.target.value=''}});

/* ---------- sheet, toast, events ---------- */
const sheetEl=document.getElementById('sheet'),sheetBody=document.getElementById('sheetBody');
let sheetClick=null;
sheetBody.addEventListener('click',e=>{if(sheetClick)sheetClick(e)});
function sheet(html){sheetClick=null;sheetBody.innerHTML=html;sheetEl.hidden=false;const f=sheetBody.querySelector('input,select,textarea');if(f)setTimeout(()=>f.focus(),50)}
function closeSheet(){sheetClick=null;sheetEl.hidden=true;sheetBody.innerHTML=''}
sheetEl.addEventListener('click',e=>{if(e.target===sheetEl)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheetEl.hidden)closeSheet()});
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='prod-toggle'){if(e.target.closest('button'))return;el.classList.toggle('open');return}
  switch(act){
    case 'week-prev':weekMon=addDays(weekMon,-7);render();break;
    case 'week-next':weekMon=addDays(weekMon,7);render();break;
    case 'week-today':weekMon=mondayOf(new Date());render();break;
    case 'slot':openSlot(el.dataset.slot);break;
    case 'slot-save':saveSlot(el.dataset.slot);break;
    case 'slot-clear':delete week().slots[el.dataset.slot];save();closeSheet();render();break;
    case 'generate':generateList();break;
    case 'close':closeSheet();break;
    case 'recipe-new':editRecipe('');break;
    case 'filter-toggle':toggleFilter(el.dataset.k,el.dataset.v);render();break;
    case 'filters-clear':F=emptyFilters();render();break;
    case 'filters-open':openFilters();break;
    case 'pick-open':openPicker(el.dataset.slot);break;
    case 'pick-filters':openFilters(()=>openPicker(el.dataset.slot));break;
    case 'pick-quick':toggleFilter(el.dataset.k,el.dataset.v);openPicker(el.dataset.slot);break;
    case 'pick-clear':F=emptyFilters();openPicker(el.dataset.slot);break;
    case 'pick-recipe':reopenSlotFromDraft(el.dataset.id);break;
    case 'pick-back':reopenSlotFromDraft();break;
    case 'recipe-plan':openPlan(el.dataset.id);break;
    case 'plan-save':savePlan(el.dataset.id);break;
    case 'filters-reset-draft':case 'filters-apply':break;
    case 'suggest':openSuggest();break;
    case 'suggest-go':suggestWeek();break;
    case 'recipe-open':openRecipe(el.dataset.id);break;
    case 'recipe-edit':editRecipe(el.dataset.id);break;
    case 'recipe-save':saveRecipe(el.dataset.id);break;
    case 'recipe-delete':deleteRecipe(el.dataset.id);break;
    case 'item-toggle':{const it=listItem(el.dataset.key);if(it){
      if(it.status==='done'){it.status='buy';stockTake(it.name,it.qty,it.fam)}
      else{it.status='done';stockAdd(it.name,it.qty,it.fam,it.cat)}
      save();render()}break}
    case 'slot-cook':openCook(el.dataset.slot);break;
    case 'cook-confirm':confirmCook(el.dataset.slot);break;
    case 'stock-new':editStock('');break;
    case 'stock-edit':editStock(el.dataset.id);break;
    case 'stock-save':saveStock(el.dataset.id);break;
    case 'stock-delete':S.stock=S.stock.filter(s=>s.id!==el.dataset.id);save();closeSheet();render();break;
    case 'item-have':{const it=listItem(el.dataset.key);if(it){it.status=it.status==='have'?'buy':'have';save();render()}break}
    case 'item-remove':{const L=S.lists[weekKey()];if(L){L.items=L.items.filter(i=>i.key!==el.dataset.key);save();render()}break}
    case 'manual-add':{
      const inp=document.getElementById('manual-name');const p=parseIng(inp.value);if(!p||!p.name){toast('Écris le nom de l’article');return}
      addManual(p);break}
    case 'extra-add':{const x=S.extras.find(e=>e.name===el.dataset.name);if(x)addManual({name:x.name,qty:x.qty||1,unit:x.unit||''});break}
    case 'item-price':{const it=listItem(el.dataset.key);if(it)priceSheet(it.name,it.fam==='g'?'kg':it.fam==='ml'?'l':it.unit,1);break}
    case 'price-save':savePrice();break;
    case 'ticket-photo':{closeSheet();if(tab!=='prices'){tab='prices';render()}const f=document.getElementById('ticket-file');if(f)f.click();break}
    case 'ticket-stop':if(ticketCtl)ticketCtl.abort();closeSheet();break;
    case 'ticket-save':saveTicket();break;
    case 'price-delete':S.prices=S.prices.filter(p=>p.id!==el.dataset.id);save();render();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='manual-name'){e.preventDefault();document.querySelector('[data-act="manual-add"]').click()}});
let pT;document.addEventListener('input',e=>{if(e.target&&e.target.id==='pick-q'){recipeQuery=e.target.value;clearTimeout(pT);pT=setTimeout(()=>{const l=document.getElementById('pick-list');const b=document.querySelector('[data-act="pick-back"]');if(l&&b)l.innerHTML=pickList(b.dataset.slot)},200)}});
let qT;document.addEventListener('input',e=>{if(e.target&&e.target.id==='recipe-q'){recipeQuery=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=e.target.selectionStart;render();const q=document.getElementById('recipe-q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}},250)}});

render();
})();
</script>
